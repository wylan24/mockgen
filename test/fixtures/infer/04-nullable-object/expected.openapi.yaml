openapi: 3.1.0
info:
  title: samples
  version: 0.0.0
paths:
  /employees/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    minimum: 0
                  manager:
                    type:
                      - object
                      - "null"
                    properties:
                      id:
                        type: integer
                        minimum: 0
                      name:
                        type: string
                    required:
                      - id
                      - name
                required:
                  - id
                  - manager
