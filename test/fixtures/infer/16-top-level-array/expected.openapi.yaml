openapi: 3.1.0
info:
  title: samples
  version: 0.0.0
paths:
  /products:
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      minimum: 0
                    name:
                      type: string
                    price:
                      type: number
                      minimum: 0
                    discount:
                      type: number
                      minimum: 0
                  required:
                    - id
                    - name
                    - price
