openapi: 3.1.0
info:
  title: samples
  version: 0.0.0
paths:
  /articles:
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      minimum: 0
                    title:
                      type: string
                    category:
                      type: string
                      enum:
                        - blog
                        - news
                  required:
                    - id
                    - title
                    - category
