openapi: 3.1.0
info:
  title: samples
  version: 0.0.0
paths:
  /users/me:
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    minimum: 0
                  role:
                    type: string
                  permissions:
                    type: array
                    items:
                      type: string
                  onboarding:
                    type: object
                    properties:
                      step:
                        type: integer
                        minimum: 0
                    required:
                      - step
                required:
                  - id
                  - role
                  - permissions
