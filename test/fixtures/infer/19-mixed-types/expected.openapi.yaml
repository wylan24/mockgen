openapi: 3.1.0
info:
  title: samples
  version: 0.0.0
paths:
  /records:
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      anyOf:
                        - type: string
                        - type: integer
                          minimum: 0
                    value:
                      anyOf:
                        - type: string
                        - type: integer
                          minimum: 0
                        - type: "null"
                  required:
                    - id
                    - value
