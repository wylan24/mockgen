openapi: 3.1.0
info:
  title: samples
  version: 0.0.0
paths:
  /people/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    minimum: 0
                  birthday:
                    type: string
                  leapDay:
                    type: string
                    format: date
                  seenAt:
                    type: string
                required:
                  - id
                  - birthday
                  - leapDay
                  - seenAt
