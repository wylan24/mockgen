openapi: 3.1.0
info:
  title: samples
  version: 0.0.0
paths:
  /sensors:
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      minimum: 0
                    balance:
                      type: integer
                    celsius:
                      type: number
                    reading:
                      type: integer
                      minimum: 0
                  required:
                    - id
                    - balance
                    - celsius
                    - reading
