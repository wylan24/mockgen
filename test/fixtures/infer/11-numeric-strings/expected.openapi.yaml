openapi: 3.1.0
info:
  title: samples
  version: 0.0.0
paths:
  /addresses:
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      minimum: 0
                    zip:
                      type: string
                    countryCode:
                      type: string
                      enum:
                        - CA
                        - US
                  required:
                    - id
                    - zip
                    - countryCode
