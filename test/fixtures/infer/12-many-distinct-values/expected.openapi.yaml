openapi: 3.1.0
info:
  title: samples
  version: 0.0.0
paths:
  /products:
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sku:
                      type: string
                    size:
                      type: string
                  required:
                    - sku
                    - size
