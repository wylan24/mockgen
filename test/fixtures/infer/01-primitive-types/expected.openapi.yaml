openapi: 3.1.0
info:
  title: samples
  version: 0.0.0
paths:
  /config:
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  port:
                    type: integer
                    minimum: 0
                  ratio:
                    type: number
                    minimum: 0
                  debug:
                    type: boolean
                  owner:
                    type: "null"
                required:
                  - name
                  - port
                  - ratio
                  - debug
                  - owner
