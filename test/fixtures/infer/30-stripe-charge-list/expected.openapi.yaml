openapi: 3.1.0
info:
  title: samples
  version: 0.0.0
paths:
  /v1/charges:
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  url:
                    type: string
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        object:
                          type: string
                          enum:
                            - charge
                        amount:
                          type: integer
                          minimum: 0
                        currency:
                          type: string
