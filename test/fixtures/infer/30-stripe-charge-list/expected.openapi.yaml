                            - usd
                        paid:
                          type: boolean
                        status:
                          type: string
                        customer:
                          type:
                            - string
                            - "null"
                        metadata:
                          type: object
                          properties:
                            order_id:
                              type: string
                        created:
                          type: integer
                          minimum: 0
                      required:
                        - id
                        - object
                        - amount
                        - currency
                        - paid
                        - status
                        - customer
                        - metadata
                        - created
                required:
                  - object
                  - url
                  - has_more
                  - data
