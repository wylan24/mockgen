openapi: 3.1.0
info:
  title: samples
  version: 0.0.0
paths:
  /users:
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      minimum: 0
                    login:
                      type: string
                  required:
                    - id
                    - login
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    minimum: 0
                  login:
                    type: string
                  followers:
                    type: integer
                    minimum: 0
                required:
                  - id
                  - login
                  - followers
  /users/{id}/posts:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      minimum: 0
                    userId:
                      type: integer
                      minimum: 0
                    title:
                      type: string
                  required:
                    - id
                    - userId
                    - title
