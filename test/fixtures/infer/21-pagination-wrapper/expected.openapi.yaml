openapi: 3.1.0
info:
  title: samples
  version: 0.0.0
paths:
  /items:
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          minimum: 0
                        name:
                          type: string
                      required:
                        - id
                        - name
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                        minimum: 0
                      perPage:
                        type: integer
                        minimum: 0
                      total:
                        type: integer
                        minimum: 0
                      hasMore:
                        type: boolean
                    required:
                      - page
                      - perPage
                      - total
                      - hasMore
                  links:
                    type: object
                    properties:
                      next:
                        type:
                          - string
                          - "null"
                        format: uri
                      prev:
                        type:
                          - string
                          - "null"
                        format: uri
                    required:
                      - next
                      - prev
                required:
                  - data
                  - meta
                  - links
