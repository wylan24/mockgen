openapi: 3.1.0
info:
  title: samples
  version: 0.0.0
paths:
  /prices:
    get:
      responses:
        "200":
          description: Inferred from samples
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    item:
                      type: string
                    price:
                      type: number
                      minimum: 0
                    quantity:
                      type: integer
                      minimum: 0
                  required:
                    - item
                    - price
                    - quantity
