name: Feature request
description: Suggest something mockgen should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, not just the feature. "When I mock X, I can't Y" helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Commands, flags or config you'd expect.
  - type: textarea
    id: workaround
    attributes:
      label: What do you do today instead?
