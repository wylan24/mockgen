name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js validate examples/petstore.yaml
      - run: node dist/cli.js validate examples/samples

  corpus:
    # The release gate: 50+ real-world specs must load (≥95%) and every
    # generated response must validate against its schema (100%).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: corpus/.cache
          key: corpus-${{ hashFiles('corpus/specs.json') }}
      - run: npm run corpus:fetch
      - run: npm run corpus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-report
          path: corpus/report.json
