name: Release

# Push a tag like v0.1.0-alpha.1 or v1.0.0 to publish that version to npm with
# provenance and create a GitHub release. The tag must match package.json.
#
# Run it manually ("Run workflow" in the Actions tab) to point a dist-tag at an
# already-published version, e.g. to move `latest` back after a bad release.
#
# Publishing uses npm trusted publishing (OIDC), no token: this repo and workflow
# file are registered as a trusted publisher of @wylan24/mockgen on npmjs.com,
# allowed to `npm publish` and `npm dist-tag`. Renaming this file breaks that link.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Published version to tag, e.g. 0.1.0-alpha.2
        required: true
      tag:
        description: Dist-tag to point at it
        required: true
        default: latest

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

jobs:
  dist-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No registry-url: setup-node would then write a placeholder token to .npmrc,
      # and npm would send it instead of using trusted publishing (needs npm 11.5.1+).
      - run: npm install -g npm@^11.5.1
      - name: Point the dist-tag at the version
        # Inputs go through env, never straight into the script.
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ && "$TAG" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::version must look like 1.2.3 or 1.2.3-alpha.1, and tag like latest or next"
            exit 1
          fi
          name="$(node -p "require('./package.json').name")"
          npm dist-tag add "$name@$VERSION" "$TAG"
          npm dist-tag ls "$name"
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # No registry-url: setup-node would then write a placeholder token to .npmrc,
      # and npm would send it instead of using trusted publishing (needs npm 11.5.1+).
      - run: npm install -g npm@^11.5.1

      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke

      - uses: actions/cache@v4
        with:
          path: corpus/.cache
          key: corpus-${{ hashFiles('corpus/specs.json') }}
      - run: npm run corpus:fetch
      - run: npm run corpus -- --strict

      # Pre-releases (0.1.0-alpha.1) go to the `next` dist-tag so `npx` keeps
      # resolving the latest stable version.
      - name: Publish to npm
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then tag=next; else tag=latest; fi
          npm publish --provenance --access public --tag "$tag" --loglevel verbose

      # Until there is a stable release, `latest` is itself a pre-release; keep it on
      # the newest one so `npx @wylan24/mockgen` gets current features. The outcome
      # goes to the docker job, so the image's `latest` tag matches npm's.
      - name: Point latest at this version if it should be latest
        id: latest
        run: |
          name="$(node -p "require('./package.json').name")"
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" != *-* ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          elif [[ "$(npm view "$name@latest" version)" == *-* ]]; then
            npm dist-tag add "$name@$version" latest
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
          npm dist-tag ls "$name"

      - name: GitHub release
        run: |
          flags=(--generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

  docker:
    # The same version as a container image for amd64 and arm64, tagged like npm:
    # the version, `next` for pre-releases, and `latest` when npm's latest moved.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow's own token
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          tags="$image:$version"
          if [[ "$version" == *-* ]]; then tags="$tags,$image:next"; fi
          if [[ "$LATEST" == true ]]; then tags="$tags,$image:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
        env:
          LATEST: ${{ needs.publish.outputs.latest }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.version=${{ github.ref_name }}
